[project]
name = "comfyui-succy-pack"
version = "0.1.0"
description = "Succy Pack for ComfyUI: live (no Queue) picture nodes (Load Image & Resize, Crop and Stitch, Primitive, Any switch, Preview Anything), Multi Math, Multi Parse, Pick Combo, Pause, Loops, Clean VRAM, Label and sexier reroutes. Built on a kit that survives frontend updates: instant Ctrl+Z without reloads, per-node undo, smart cache, RAM ceiling, resource monitor."
readme = "README.md"
license = { text = "MIT with attribution (see LICENSE): credit Succubus Vyper" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# a real 2-second timeout for Multi Parse's regex mode (without it, dangerous nested patterns are refused instead)
regex = ["regex"]

[project.urls]
Repository = "https://github.com/succubus-vyper/ComfyUI-Succy-Pack"
Support = "https://ko-fi.com/succubusvyper"

[tool.comfy]
DisplayName = "Succy Pack"
Icon = ""
